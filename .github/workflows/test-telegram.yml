name: Test Telegram alert

# 텔레그램 봇 알림 검증용. 1회 실행 후 삭제 권장.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send success test message
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT" ] || [ -z "$CHAT" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN 또는 TELEGRAM_CHAT_ID secret 미설정"
            exit 1
          fi
          curl -sS -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=✅ [Metal Watch] 알림 시스템 검증 — 정상 작동 중. (성공 메시지 테스트)"
          echo "성공 메시지 전송 완료"

      - name: Trigger intentional failure
        run: |
          echo "🔥 의도적 실패 — if:failure() 알림 step 검증"
          exit 1

      - name: 텔레그램 실패 알림
        if: failure()
        continue-on-error: true
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          WF: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$BOT" ] || [ -z "$CHAT" ]; then
            echo "Secret 미설정 — 알림 건너뜀"
            exit 0
          fi
          SHA_SHORT="${GITHUB_SHA:0:7}"
          TEXT=$(printf '🚨 [Metal Watch] %s 실패\n\n실행: #%s\n브랜치: %s\n커밋: %s\n\n로그: https://github.com/%s/actions/runs/%s' \
            "$WF" "$RUN_ID" "$BRANCH" "$SHA_SHORT" "$REPO" "$RUN_ID")
          curl -sS -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true"
