name: Collect prices

on:
  # 매시 5분(UTC). GitHub 사정으로 5~15분 지연될 수 있음.
  schedule:
    - cron: "5 * * * *"
  # 수동 실행도 가능 (Actions 탭 → Run workflow 버튼)
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/collect.js
