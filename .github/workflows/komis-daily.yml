name: Daily KOMIS auto-download

# 매일 KST 10:00 (01:00 UTC) — LME 종목 커버
# 매일 KST 22:00 (13:00 UTC) — 희소금속 발표 후 갱신
on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
          pip install openpyxl

      - name: Download KOMIS xlsx via Playwright
        run: node scripts/download-komis.js

      - name: Convert xlsx → JSON
        run: python scripts/convert-komis-xlsx.py

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/data/*-komis.json
          if git diff --cached --quiet; then
            echo "변경사항 없음 — 커밋 스킵"
          else
            git commit -m "data: daily KOMIS update ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Backfill to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/backfill-all-komis.js

      - name: 텔레그램 성공 알림 (종목별 최신 날짜)
        if: success()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/notify-komis-status.js

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: komis-debug
          path: |
            tmp/komis/
          if-no-files-found: ignore
          retention-days: 7

      - name: 텔레그램 실패 알림
        if: failure()
        continue-on-error: true
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          WF: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$BOT" ] || [ -z "$CHAT" ]; then
            echo "TELEGRAM_BOT_TOKEN 또는 TELEGRAM_CHAT_ID 미설정 — 알림 건너뜀"
            exit 0
          fi
          SHA_SHORT="${GITHUB_SHA:0:7}"
          TEXT=$(printf '🚨 [Metal Watch] %s 실패\n\n실행: #%s\n브랜치: %s\n커밋: %s\n\n로그: https://github.com/%s/actions/runs/%s' \
            "$WF" "$RUN_ID" "$BRANCH" "$SHA_SHORT" "$REPO" "$RUN_ID")
          curl -sS -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true"
